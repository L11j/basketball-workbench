<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>篮训工作台 · 青少年一个月训练计划</title>
<style>
  :root {
    --bg: #0e0e11;
    --panel: #17171c;
    --panel-2: #1f1f26;
    --pink: #5b8def;
    --pink-soft: rgba(255, 92, 138, 0.14);
    --pink-line: rgba(255, 92, 138, 0.35);
    --text: #f2f2f5;
    --text-dim: #9a9aa5;
    --line: #2a2a33;
    --green: #4ade80;
    --radius: 14px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
    min-height: 100vh;
  }
  /* ===== 顶部 ===== */
  header {
    background: linear-gradient(135deg, #0a0a0d 0%, #1a1016 60%, #241019 100%);
    border-bottom: 1px solid var(--pink-line);
    padding: 26px 32px;
    display: flex;
    align-items: center;
    gap: 18px;
    flex-wrap: wrap;
  }
  .logo {
    width: 54px; height: 54px;
    background: var(--pink-soft);
    border: 2px solid var(--pink);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 28px;
  }
  h1 { font-size: 22px; letter-spacing: 1px; }
  h1 .pink { color: var(--pink); }
  .sub { color: var(--text-dim); font-size: 13px; margin-top: 4px; }
  .head-stats { margin-left: auto; display: flex; gap: 14px; }
  .stat {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 10px 18px;
    text-align: center;
    min-width: 96px;
  }
  .stat .num { font-size: 22px; font-weight: 700; color: var(--pink); }
  .stat .lbl { font-size: 12px; color: var(--text-dim); margin-top: 2px; }

  /* ===== 进度条 ===== */
  .progress-wrap { padding: 16px 32px 0; }
  .progress-bar-bg {
    height: 10px; background: var(--panel-2);
    border-radius: 6px; overflow: hidden;
    border: 1px solid var(--line);
  }
  .progress-bar-fill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, #ff8fb1, var(--pink));
    border-radius: 6px;
    transition: width .4s ease;
  }
  .progress-text { font-size: 12px; color: var(--text-dim); margin-top: 6px; }

  /* ===== Tabs ===== */
  nav.tabs {
    display: flex; gap: 8px;
    padding: 18px 32px 0;
  }
  .tab-btn {
    background: var(--panel);
    color: var(--text-dim);
    border: 1px solid var(--line);
    padding: 10px 22px;
    border-radius: 999px;
    font-size: 14px;
    cursor: pointer;
    transition: all .2s;
  }
  .tab-btn:hover { color: var(--text); border-color: var(--pink-line); }
  .tab-btn.active {
    background: var(--pink-soft);
    color: var(--pink);
    border-color: var(--pink);
    font-weight: 600;
  }

  main { padding: 20px 32px 60px; }
  .view { display: none; }
  .view.active { display: block; }

  /* ===== 周阶段卡 ===== */
  .phase-strip {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 20px;
  }
  .phase-card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-left: 4px solid var(--pink);
    border-radius: var(--radius);
    padding: 14px 16px;
  }
  .phase-card .wk { font-size: 12px; color: var(--pink); font-weight: 600; }
  .phase-card .nm { font-size: 15px; font-weight: 600; margin: 4px 0; }
  .phase-card .ds { font-size: 12px; color: var(--text-dim); line-height: 1.5; }

  /* ===== 日历 ===== */
  .cal-head {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 8px;
    margin-bottom: 8px;
  }
  .cal-head div {
    text-align: center;
    font-size: 12px;
    color: var(--text-dim);
    padding: 6px 0;
  }
  .cal-head div.wkend { color: var(--pink); }
  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 8px;
  }
  .day {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    min-height: 92px;
    padding: 8px;
    position: relative;
    transition: border-color .2s, transform .2s;
  }
  .day.out { opacity: .35; }
  .day .dnum { font-size: 13px; color: var(--text-dim); }
  .day .month-tag { font-size: 10px; color: var(--text-dim); margin-left: 3px; }
  .day.session {
    background: linear-gradient(160deg, var(--panel-2), #241218);
    border: 1px solid var(--pink-line);
    cursor: pointer;
  }
  .day.session:hover { transform: translateY(-2px); border-color: var(--pink); }
  .day.session .dnum { color: var(--pink); font-weight: 700; }
  .day .s-title { font-size: 12px; font-weight: 600; margin-top: 6px; line-height: 1.4; }
  .day .s-tag {
    display: inline-block;
    font-size: 10px;
    color: var(--pink);
    background: var(--pink-soft);
    border-radius: 999px;
    padding: 2px 8px;
    margin-top: 6px;
  }
  .day.done { border-color: var(--green); }
  .day.today {
    border: 2px solid var(--pink);
    box-shadow: 0 0 10px rgba(255, 92, 138, .45);
  }
  .day.today .dnum { color: var(--pink); font-weight: 700; }
  .day .done-mark {
    position: absolute; top: 8px; right: 8px;
    color: var(--green); font-size: 13px; font-weight: 700;
  }

  /* ===== 训练库 ===== */
  .filter-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
  .filter-btn {
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--text-dim);
    padding: 7px 16px;
    border-radius: 999px;
    font-size: 13px;
    cursor: pointer;
    transition: all .2s;
  }
  .filter-btn.active {
    background: var(--pink-soft);
    color: var(--pink);
    border-color: var(--pink);
    font-weight: 600;
  }
  #drill-search {
    width: 100%;
    max-width: 420px;
    display: block;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    color: var(--text);
    padding: 10px 14px;
    font-size: 14px;
    margin-bottom: 12px;
    outline: none;
    transition: border-color .2s;
  }
  #drill-search:focus { border-color: var(--pink); }
  .no-result {
    color: var(--text-dim);
    font-size: 14px;
    padding: 24px 4px;
  }
  .drill-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
    gap: 14px;
  }
  .drill-card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px 18px;
    transition: border-color .2s, transform .2s;
  }
  .drill-card:hover { border-color: var(--pink-line); transform: translateY(-2px); }
  .drill-top { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .drill-ico {
    width: 38px; height: 38px; border-radius: 10px;
    background: var(--pink-soft);
    display: flex; align-items: center; justify-content: center;
    font-size: 19px;
    flex-shrink: 0;
  }
  .drill-name { font-size: 15px; font-weight: 600; }
  .drill-meta { font-size: 11px; color: var(--text-dim); margin-top: 2px; }
  .drill-meta .diff { color: var(--pink); letter-spacing: 1px; }
  .drill-points { font-size: 12.5px; color: var(--text-dim); line-height: 1.7; }
  .drill-points b { color: var(--text); font-weight: 600; }

  /* ===== 弹窗 ===== */
  .modal-mask {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,.65);
    z-index: 50;
    align-items: center; justify-content: center;
    padding: 20px;
  }
  .modal-mask.show { display: flex; }
  .modal {
    background: var(--panel);
    border: 1px solid var(--pink-line);
    border-radius: 18px;
    max-width: 620px; width: 100%;
    max-height: 86vh; overflow-y: auto;
    padding: 26px 28px;
  }
  .modal h3 { font-size: 18px; margin-bottom: 4px; }
  .modal .m-sub { font-size: 13px; color: var(--text-dim); margin-bottom: 16px; }
  .plan-sec { margin-bottom: 14px; }
  .plan-sec .sec-head {
    display: flex; justify-content: space-between; align-items: center;
    background: var(--pink-soft);
    border-radius: 8px;
    padding: 7px 12px;
    margin-bottom: 8px;
  }
  .plan-sec .sec-head b { color: var(--pink); font-size: 13px; }
  .plan-sec .sec-head span { font-size: 12px; color: var(--text-dim); }
  .plan-sec ul { list-style: none; }
  .plan-sec li {
    font-size: 13px; color: var(--text);
    padding: 4px 0 4px 18px;
    position: relative; line-height: 1.6;
  }
  .plan-sec li::before {
    content: "▸";
    position: absolute; left: 4px;
    color: var(--pink);
  }
  .modal-actions { display: flex; gap: 10px; margin-top: 18px; }
  .btn {
    flex: 1;
    padding: 11px 0;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--panel-2);
    color: var(--text);
    font-size: 14px;
    cursor: pointer;
    transition: all .2s;
  }
  .btn:hover { border-color: var(--pink-line); }
  .btn.primary {
    background: var(--pink);
    border-color: var(--pink);
    color: #14060b;
    font-weight: 700;
  }
  .btn.primary.done-state {
    background: transparent;
    color: var(--green);
    border-color: var(--green);
  }
  .close-x {
    float: right;
    background: none; border: none;
    color: var(--text-dim); font-size: 20px;
    cursor: pointer;
  }
  .close-x:hover { color: var(--pink); }

  @media (max-width: 860px) {
    .phase-strip { grid-template-columns: repeat(2, 1fr); }
    .day { min-height: 72px; }
    .day .s-title { font-size: 10px; }
    header { padding: 20px; }
    .head-stats { width: 100%; }
    main, nav.tabs, .progress-wrap { padding-left: 16px; padding-right: 16px; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">🏀</div>
  <div>
    <h1>篮训<span class="pink">工作台</span></h1>

  </div>
  <div class="head-stats">

    <div class="stat"><div class="num" id="stat-done">0</div><div class="lbl">已完成</div></div>
    <div class="stat"><div class="num" id="stat-min">900</div><div class="lbl">总时长(分钟)</div></div>
  </div>
</header>

  <div class="progress-bar-bg"><div class="progress-bar-fill" id="pbar"></div></div>
  <div class="progress-text" id="ptext">月度进度：0 / 10 课已完成，继续加油！</div>
</div>

<nav class="tabs">
  <button class="tab-btn active" data-view="calendar">📅 月度训练日历</button>
  <button class="tab-btn" data-view="library">📕 训练内容库</button>
</nav>

<main>

  <section class="view active" id="view-calendar">

    </div>
    <div class="cal-grid" id="cal-grid"></div>
  </section>

  <!-- 训练库视图 -->
  <section class="view" id="view-library">
    <input type="text" id="drill-search" placeholder="🔍 输入动作名搜索，如：投篮 / 防守" oninput="renderDrills()">
    <div class="filter-bar" id="filter-bar"></div>
    <div class="drill-grid" id="drill-grid"></div>
  </section>
</main>

<!-- 课次详情弹窗 -->
<div class="modal-mask" id="modal-mask">
  <div class="modal">
    <button class="close-x" onclick="closeModal()">✕</button>
    <h3 id="m-title"></h3>
    <div class="m-sub" id="m-sub"></div>
    <div id="m-body"></div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">关 闭</button>
      <button class="btn primary" id="m-done-btn" onclick="toggleDone(currentKey)"></button>
    </div>
  </div>
</div>

/* ================= 状态 ================= */
const STORE_KEY = "basketball-workbench-done";
let doneSet = new Set(JSON.parse(localStorage.getItem(STORE_KEY) || "[]"));
let currentKey = null;
let currentCat = "all";

function save() {
  localStorage.setItem(STORE_KEY, JSON.stringify([...doneSet]));
  refreshStats();
}

function refreshStats() {
  const total = Object.keys(SESSIONS).length;
  const done = doneSet.size;
  document.getElementById("stat-done").textContent = done;
  document.getElementById("pbar").style.width = (done / total * 100) + "%";
  document.getElementById("ptext").textContent =
    done === total
      ? "🎉 月度计划全部完成！为孩子们的表现鼓掌！"
      : `月度进度：${done} / ${total} 课已完成，继续加油！`;
  document.querySelectorAll(".day.session").forEach(el => {
    el.classList.toggle("done", doneSet.has(el.dataset.key));
  });
  document.querySelectorAll(".day.session").forEach(el => {
    let mark = el.querySelector(".done-mark");
    if (doneSet.has(el.dataset.key) && !mark) {
      mark = document.createElement("div");
      mark.className = "done-mark";
      mark.textContent = "✓";
      el.appendChild(mark);
    } else if (!doneSet.has(el.dataset.key) && mark) {
      mark.remove();
    }
  });
}

/* ================= 日历 ================= */
// 渲染 2026-09-14(周一) ~ 2026-10-18(周日)，共 5 周
(function renderCalendar() {
  const grid = document.getElementById("cal-grid");
  const start = new Date(2026, 8, 14);   // 9月14日 周一
  const end = new Date(2026, 9, 18);     // 10月18日 周日
  let html = "";
  const now = new Date();
  const todayKey = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}-${String(now.getDate()).padStart(2, "0")}`;
  const d = new Date(start);
  while (d <= end) {
    const y = d.getFullYear(), m = d.getMonth() + 1, day = d.getDate();
    const key = `${y}-${String(m).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
    const isToday = key === todayKey;
    const isOut = (d.getMonth() === 8 && day < 19) || false; // 9月19日前为灰显
    const s = SESSIONS[key];
    const showMonth = day === 1 || (day === 14 && m === 9) ? `<span class="month-tag">${m}月</span>` : "";
    if (s) {
      html += `
      <div class="day session${doneSet.has(key) ? " done" : ""}${isOut ? " out" : ""}${isToday ? " today" : ""}" data-key="${key}" onclick="openModal('${key}')">
        <div class="dnum">${day}${showMonth}</div>
        <div class="s-title">${s.title}</div>
        <span class="s-tag">90min</span>
      </div>`;
    } else {
      html += `<div class="day${isOut ? " out" : ""}${isToday ? " today" : ""}"><div class="dnum">${day}${showMonth}</div></div>`;
    }
    d.setDate(d.getDate() + 1);
  }
  grid.innerHTML = html;
})();

/* ================= 训练库 ================= */
function renderFilters() {
  document.getElementById("filter-bar").innerHTML = CATS.map(c => `
    <button class="filter-btn${c.id === currentCat ? " active" : ""}" onclick="setCat('${c.id}')">
      ${c.ico} ${c.name}
    </button>`).join("");
}
function renderDrills() {
  const q = (document.getElementById("drill-search").value || "").trim();
  const list = DRILLS.filter(d => (currentCat === "all" || d.cat === currentCat)
    && (!q || d.name.includes(q) || d.points.includes(q)));
  const html = list.map(d => `
    <div class="drill-card">
      <div class="drill-top">
        <div class="drill-ico">${d.ico}</div>
        <div>
          <div class="drill-name">${d.name}</div>
          <div class="drill-meta">⏱ ${d.dur} ｜ 难度 <span class="diff">${"★".repeat(d.diff)}${"☆".repeat(3 - d.diff)}</span></div>
        </div>
      </div>
      <div class="drill-points">${d.points}</div>
    </div>`).join("") || `<div class="no-result">🔍 没找到匹配的动作，换个关键词试试～</div>`;
  document.getElementById("drill-grid").innerHTML = html;
}
function setCat(id) { currentCat = id; renderFilters(); renderDrills(); }
renderFilters(); renderDrills();

/* ================= 弹窗 ================= */
function secBlock(title, time, items) {
  return `
  <div class="plan-sec">
    <div class="sec-head"><b>${title}</b><span>${time}</span></div>
    <ul>${items.map(i => `<li>${i}</li>`).join("")}</ul>
  </div>`;
}
function openModal(key) {
  const s = SESSIONS[key];
  if (!s) return;
  currentKey = key;
  document.getElementById("m-title").textContent = `🏀 ${s.title}`;
  document.getElementById("m-sub").textContent =
    `${s.tag} ｜ ${key.replace(/-/g, ".")} ｜ 时长 90 分钟`;
  let body = secBlock("🔥 热身激活", "约 15 分钟", s.warmup);
  body += secBlock("📋 主题训练", "约 55 分钟", s.main);
  body += secBlock("🎮 实战游戏", "约 15 分钟", s.game);
  body += secBlock("🧘 放松总结", "约 5 分钟", s.cool);
  body += `<div class="plan-sec"><div class="sec-head"><b>🎯 本课重点</b><span></span></div>
    <ul><li>${s.focus}</li></ul></div>`;
  document.getElementById("m-body").innerHTML = body;
  const btn = document.getElementById("m-done-btn");
  const isDone = doneSet.has(key);
  btn.textContent = isDone ? "✓ 已完成（点击取消）" : "标记为已完成";
  btn.classList.toggle("done-state", isDone);
  document.getElementById("modal-mask").classList.add("show");
}
function closeModal() {
  document.getElementById("modal-mask").classList.remove("show");
  currentKey = null;
}
function toggleDone(key) {
  if (!key) return;
  if (doneSet.has(key)) doneSet.delete(key); else doneSet.add(key);
  save();
  openModal(key); // 刷新按钮状态
}
document.getElementById("modal-mask").addEventListener("click", e => {
  if (e.target === e.currentTarget) closeModal();
});

document.querySelectorAll(".tab-btn").forEach(btn => {

    document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
    document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
    btn.classList.add("active");
    document.getElementById("view-" + btn.dataset.view).classList.add("active");
  });
});
